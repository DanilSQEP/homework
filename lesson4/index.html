<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урок 4. Формы</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <form class="form">
      <fieldset class="form-group">
        <legend class="form-group-title">Ваши личные данные</legend>
        <label for="text" class="label">Ваше имя</label>
        <input
          id="text"
          class="input"
          type="text"
          placeholder="Имя"
          name="text"
          required
        />

        <label for="age" class="label">Ваш возраст</label>
        <input
          id="age"
          class="input"
          type="number"
          placeholder="Возраст"
          name="age"
          required
        />

        <label for="phone" class="label">Ваш номер телефона</label>
        <input
          id="phone"
          class="input"
          type="tel"
          inputmode="tel"
          placeholder="Номер телефона"
          name="phone"
          required
        />

        <label for="email" class="label">Ваша почта</label>
        <input
          id="email"
          class="input"
          type="email"
          inputmode="email"
          placeholder="Почта"
          name="email"
          required
        />
      </fieldset>
      <fieldset class="form-group">
        <label for="message" class="label">Сообщение</label>
        <textarea
          id="message"
          class="textarea"
          name="message"
          placeholder="Ваше сообщение"
          required
        ></textarea>

        <label class="label">
          <input class="checkbox" type="checkbox" name="checkbox" required />
          Я принимаю правила
        </label>
      </fieldset>
      <button class="button" type="submit">Отправить</button>
    </form>
  </body>
</html>
